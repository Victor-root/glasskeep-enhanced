# Pins the JVM the Gradle Daemon itself runs on (separate from
# compileOptions/kotlinOptions, which target the app's own bytecode).
# AGP 9.4.0 requires JDK 17+; Gradle finds a matching local JDK or
# downloads one automatically if none is found, so this stays
# consistent across machines instead of depending on whatever JDK
# Android Studio happens to have configured.
toolchainVersion=17
