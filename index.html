<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Favicon. The 512x512 PNG is the primary source — modern browsers
       downsample it to whatever pixel size they need (16 in tabs, 32 in
       bookmarks, up to 192 for pinned shortcuts) for a much sharper
       result than the small bitmaps. The 32 and 16 PNG sizes stay so
       browsers that explicitly ask for them don't have to downsample
       the big image. The .ico is the legacy fallback for very old
       browsers (IE 11 etc.) that can't read PNG favicons. -->
  <link rel="icon" type="image/png" href="/favicon.png" sizes="512x512">
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
  <link rel="icon" href="/favicon.ico" sizes="any">

  <!-- iOS / iPadOS home screen icon -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e7e9fc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Glass Keep</title>
  <script>
    /* Dark mode BEFORE first paint. The app otherwise toggles `.dark` from a
       React effect (App.jsx), so a dark-mode user gets a white flash on every
       cold load. Mirror that effect's decision here, synchronously: a manual
       session preference wins, else follow the OS (prefers-color-scheme) —
       the same source the app falls back to (incognito has no session pref,
       so it correctly follows the OS). With `.dark` set now, body paints with
       the dark --gk-app-bg straight away. */
    (function () {
      try {
        var pref = sessionStorage.getItem('glass-keep-dark-mode-manual');
        var dark = pref !== null
          ? pref === 'true'
          : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <script>
    /* Boot-time branding: apply the cached custom app name + logo to the
       tab title and favicon BEFORE React mounts, so a reload doesn't
       flash the default name/logo. The BrandingProvider reads the same
       cache for its first render and then refreshes from the server.
       We also snapshot the bundled icon links so the app can restore
       them verbatim if the admin later clears the custom logo. */
    (function () {
      try {
        var sel = 'link[rel~="icon"], link[rel="apple-touch-icon"]';
        window.__GK_DEFAULT_ICONS__ = Array.prototype.map
          .call(document.head.querySelectorAll(sel), function (l) { return l.outerHTML; })
          .join('');
        var c = JSON.parse(localStorage.getItem('gk:branding') || 'null');
        if (c && c.appName) document.title = c.appName;
        var fav = localStorage.getItem('gk:favicon');
        if (fav) {
          Array.prototype.forEach.call(document.head.querySelectorAll(sel), function (l) {
            l.parentNode.removeChild(l);
          });
          var icon = document.createElement('link'); icon.rel = 'icon'; icon.href = fav;
          document.head.appendChild(icon);
          var apple = document.createElement('link'); apple.rel = 'apple-touch-icon'; apple.href = fav;
          document.head.appendChild(apple);
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script>
    /* Login-background boot: paint an instant placeholder (mean colour, then
       the decoded BlurHash) BEFORE React mounts, and preload the real image
       so AuthShell can cross-fade it in (colour → blurhash → sharp image).
       Runs synchronously at the top of <body> so document.body exists and it
       executes before the deferred React module — no flash of the default
       backdrop, even on a cold/incognito load.

       Only on the login screen: a logged-in user (auth token present) must
       not see the login backdrop behind the app. Source order: the server
       injects window.__GK_LOGIN_BG__ on a cold load; otherwise we reuse the
       cached branding placeholders (warm reload / offline PWA shell). */
    (function () {
      try {
        var auth = JSON.parse(localStorage.getItem('glass-keep-auth') || 'null');
        if (auth && auth.token) return; // logged in — not the login page
        var bg = window.__GK_LOGIN_BG__ || null;
        if (!bg) {
          var c = JSON.parse(localStorage.getItem('gk:branding') || 'null');
          if (c && c.loginBackground && c.loginBackgroundColor) {
            bg = { url: c.loginBackground, color: c.loginBackgroundColor, hash: c.loginBackgroundHash };
          }
        }
        if (!bg || !bg.color) return;
        document.documentElement.classList.add('gk-has-login-bg');
        if (bg.url) {
          var pre = document.createElement('link');
          pre.rel = 'preload'; pre.as = 'image'; pre.href = bg.url;
          document.head.appendChild(pre);
        }

        /* Minimal standard BlurHash decoder (returns RGBA pixels, or null). */
        function decodeBlurhash(hash, width, height) {
          var D = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#$%*+,-.:;=?@[]^_{|}~";
          function d83(s, a, b) { var v = 0; for (var i = a; i < b; i++) { var p = D.indexOf(s[i]); if (p < 0) return -1; v = v * 83 + p; } return v; }
          function toLin(x) { var v = x / 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
          function toSRGB(x) { var v = Math.max(0, Math.min(1, x)); return v <= 0.0031308 ? Math.round(v * 12.92 * 255 + 0.5) : Math.round((1.055 * Math.pow(v, 1 / 2.4) - 0.055) * 255 + 0.5); }
          function sp(v, e) { return (v < 0 ? -1 : 1) * Math.pow(Math.abs(v), e); }
          if (!hash || hash.length < 6) return null;
          var sf = d83(hash, 0, 1), numY = Math.floor(sf / 9) + 1, numX = (sf % 9) + 1;
          if (hash.length !== 4 + 2 * numX * numY) return null;
          var maxV = (d83(hash, 1, 2) + 1) / 166, colors = [], n = numX * numY;
          for (var i = 0; i < n; i++) {
            if (i === 0) { var v = d83(hash, 2, 6); colors.push([toLin(v >> 16), toLin((v >> 8) & 255), toLin(v & 255)]); }
            else { var w = d83(hash, 4 + i * 2, 6 + i * 2), r = Math.floor(w / 361), g = Math.floor(w / 19) % 19, b = w % 19; colors.push([sp((r - 9) / 9, 2) * maxV, sp((g - 9) / 9, 2) * maxV, sp((b - 9) / 9, 2) * maxV]); }
          }
          var px = new Uint8ClampedArray(width * height * 4);
          for (var y = 0; y < height; y++) for (var x = 0; x < width; x++) {
            var rr = 0, gg = 0, bb = 0;
            for (var j = 0; j < numY; j++) for (var k = 0; k < numX; k++) {
              var basis = Math.cos(Math.PI * x * k / width) * Math.cos(Math.PI * y * j / height), cc = colors[k + j * numX];
              rr += cc[0] * basis; gg += cc[1] * basis; bb += cc[2] * basis;
            }
            var o = 4 * (x + y * width);
            px[o] = toSRGB(rr); px[o + 1] = toSRGB(gg); px[o + 2] = toSRGB(bb); px[o + 3] = 255;
          }
          return px;
        }

        var layer = document.createElement('div');
        layer.id = 'gk-login-bg-boot';
        layer.setAttribute('aria-hidden', 'true');
        layer.style.cssText = 'position:fixed;inset:0;z-index:-1;pointer-events:none;background-color:' + bg.color + ';background-size:cover;background-position:center;background-repeat:no-repeat;';
        if (bg.hash) {
          try {
            var px = decodeBlurhash(bg.hash, 32, 32);
            if (px) {
              var cv = document.createElement('canvas'); cv.width = 32; cv.height = 32;
              cv.getContext('2d').putImageData(new ImageData(px, 32, 32), 0, 0);
              layer.style.backgroundImage = 'url(' + cv.toDataURL() + ')';
            }
          } catch (e) { /* canvas/ImageData unavailable — colour-only fallback */ }
        }
        document.body.appendChild(layer);
      } catch (e) { /* never let the backdrop break boot */ }
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
